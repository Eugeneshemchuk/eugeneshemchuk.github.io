<!doctype html>
<!-- typefun: typography playground. Random, effects, favourites, colour flow. Keys: R random, H panel, Space pause, S PNG. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>typefun</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b313a}
  canvas{display:block;width:100vw;height:100vh;cursor:none;touch-action:none}
  #hud{position:fixed;right:16px;bottom:12px;font:600 12px ui-monospace,Menlo,monospace;color:#8a929c;
    background:#0006;padding:4px 8px;letter-spacing:.05em;pointer-events:none}
  #panel{position:fixed;top:12px;left:12px;width:min(272px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;
    background:#14181dee;color:#cfd4da;font:12px/1.3 ui-monospace,Menlo,monospace;border:1px solid #3a424d;
    border-radius:10px;padding:10px 12px;box-sizing:border-box;cursor:auto;backdrop-filter:blur(6px)}
  #panel.hidden{display:none}
  #panel h2{margin:12px 0 6px;font-size:10px;letter-spacing:.12em;color:#7d8691;text-transform:uppercase;font-weight:600}
  #controls details{border-top:1px solid #2a3038;margin-top:8px}
  #controls summary{cursor:pointer;list-style:none;padding:8px 0 4px;font-size:10px;letter-spacing:.12em;color:#7d8691;text-transform:uppercase;font-weight:600;display:flex;justify-content:space-between}
  #controls summary::-webkit-details-marker{display:none}
  #controls summary::after{content:"+"}#controls details[open] summary::after{content:"−"}
  @media (pointer:coarse){select,input[type=text],textarea{font-size:16px}button{min-height:44px}input[type=range]{height:32px}}
  @media (max-width:480px){#panel{top:auto;bottom:0;left:0;width:100vw;max-height:60dvh;border-radius:14px 14px 0 0;border-width:1px 0 0;padding-bottom:max(12px,env(safe-area-inset-bottom))}
    #show{top:auto;bottom:max(12px,env(safe-area-inset-bottom))}#hud{bottom:auto;top:12px}}
  .row{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:6px;margin:4px 0}
  .row span.v{text-align:right;color:#8a929c}
  .row.wide{grid-template-columns:86px 1fr}
  input[type=range]{width:100%;accent-color:#ff8a3d}
  input[type=text],select,textarea{width:100%;box-sizing:border-box;background:#0d1014;color:#e6e9ee;border:1px solid #3a424d;
    border-radius:4px;padding:5px 6px;font:12px ui-monospace,Menlo,monospace}
  textarea{resize:vertical;min-height:40px}
  input[type=color]{width:100%;height:22px;border:1px solid #3a424d;background:none;padding:0;border-radius:4px}
  button{background:#0d1014;color:#cfd4da;border:1px solid #3a424d;border-radius:4px;padding:6px 6px;
    font:12px ui-monospace,Menlo,monospace;cursor:pointer}
  button:hover{border-color:#7d8691}
  #random{width:100%;padding:11px;font-size:14px;font-weight:700;letter-spacing:.06em;color:#14181d;border:0;
    background:linear-gradient(90deg,#ff8a3d,#ff3d7f,#7a5cff,#3dc8ff,#ff8a3d);background-size:300% 100%;animation:slide 6s linear infinite}
  @keyframes slide{to{background-position:300% 0}}
  .line{display:flex;gap:4px;margin-top:6px}.line select{flex:1}.line button{flex:0 0 auto}
  .btns{display:flex;gap:4px;margin-top:10px}.btns button{flex:1}
  .hint{color:#6b737d;font-size:11px;margin:6px 0 0}
  #show{position:fixed;top:12px;left:12px;display:none;gap:4px}
  #show button{background:#14181dcc}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14181dee;color:#e6e9ee;
    font:12px ui-monospace,Menlo,monospace;padding:6px 12px;border-radius:6px;border:1px solid #3a424d;opacity:0;transition:opacity .3s;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="toast"></div>
<div id="show"><button id="showBtn">controls</button><button id="miniRandom">🎲</button></div>
<div id="panel">
  <button id="random">🎲 RANDOM</button>
  <div class="row wide" style="margin-top:8px"><span>effect</span><select id="effect"></select></div>
  <p class="hint" id="effectNote"></p>
  <div class="line"><select id="favs"></select><button id="favSave" title="save as favourite">★ save</button><button id="favDel" title="delete this favourite">✕</button></div>
  <h2>Text</h2>
  <textarea id="text" spellcheck="false"></textarea>
  <div id="controls"></div>
  <div class="btns"><button id="reset">reset</button><button id="link">copy link</button><button id="hide">hide (H)</button></div>
  <p class="hint">R random · Space pause · S save PNG · tap/click for Ripple &amp; Explode</p>
</div>
<script>
(function () {
  // ---------- effects: the mechanic + its own physics defaults ----------
  var EFFECTS = {
    lookaway: { label: "Look away", note: "Letters flee from the cursor.", radius: 150, strength: 1, spring: .015, damping: .86 },
    swirl:    { label: "Swirl", note: "Letters orbit the cursor.", radius: 190, strength: 1, spring: .008, damping: .9 },
    magnet:   { label: "Magnet", note: "Letters are pulled in and grow.", radius: 220, strength: .8, spring: .03, damping: .82 },
    closing:  { label: "Closing in", note: "Keep moving. Sit still and it closes in.", radius: 230, strength: 1, spring: .02, damping: .85 },
    rubble:   { label: "Rubble", note: "Touched letters fall and pile up.", radius: 60, strength: 1, spring: .015, damping: .86 },
    ripple:   { label: "Ripple", note: "Click or tap: rings push the letters.", radius: 90, strength: 1, spring: .02, damping: .88 },
    explode:  { label: "Explode", note: "Click or tap: letters blow apart and come back.", radius: 280, strength: 1, spring: .006, damping: .94 },
    none:     { label: "Just motion", note: "No cursor effect. Only the motion extras.", radius: 150, strength: 1, spring: .02, damping: .86 }
  };
  var FONTS = {
    mono: "ui-monospace, SFMono-Regular, Menlo, monospace", courier: "'Courier New', Courier, monospace",
    helvetica: "'Helvetica Neue', Helvetica, Arial, sans-serif", impact: "Impact, 'Arial Black', sans-serif",
    georgia: "Georgia, serif", times: "'Times New Roman', Times, serif", futura: "Futura, 'Avenir Next', sans-serif",
    didot: "Didot, 'Bodoni 72', 'Bodoni MT', serif", rockwell: "Rockwell, 'American Typewriter', serif",
    marker: "'Marker Felt', 'Comic Sans MS', cursive", chalk: "Chalkduster, 'Bradley Hand', cursive",
    copperplate: "Copperplate, 'Copperplate Gothic Light', fantasy"
  };
  var DEFAULTS = {
    text: "HELLO WORLD!", effect: "lookaway", font: "mono", size: 15, weight: 600, line: 1.55, spacing: 0,
    sizeMix: 0, caseMode: "upper", seed: 1,
    radius: 150, strength: 1, spring: .015, damping: .86, tilt: 0, regrow: 6, gravity: .45, pileMax: .5, calm: 2.5,
    guiltRate: 1, jitter: 0, wave: 0, breathe: 0, spin: 0, slide: 0, glitch: 0, trail: 0,
    flow: 0, flowSpeed: .5, palette: "rainbow", blobs: 0, bg: "#2b313a", ink: "#cdd2d8", guilt: "#ff4637", counter: 1, ring: 1
  };
  var CONTROLS = [
    ["h", "Type"],
    ["select", "font", "font", Object.keys(FONTS)],
    ["select", "caseMode", "case", ["upper", "lower", "as typed", "mixed"]],
    ["range", "size", "size", 4, 200, 1], ["range", "sizeMix", "size chaos", 0, 1.5, .05],
    ["range", "weight", "weight", 100, 900, 100], ["range", "line", "line height", .5, 3.5, .05],
    ["range", "spacing", "spacing", -40, 240, .5],
    ["h", "Effect"],
    ["range", "radius", "radius", 20, 600, 5], ["range", "strength", "strength", 0, 4, .05],
    ["range", "spring", "return", 0, .08, .001], ["range", "damping", "damping", .6, .99, .01],
    ["range", "regrow", "regrow s", 1, 30, .5, "rubble"], ["range", "gravity", "gravity", .05, 1.5, .05, "rubble"],
    ["range", "pileMax", "pile max", .1, .9, .05, "rubble"], ["range", "calm", "calm s", .5, 10, .5, "closing"],
    ["h", "Motion"],
    ["range", "slide", "rows slide", 0, 3, .05], ["range", "wave", "drift wave", 0, 1.5, .02],
    ["range", "spin", "spin", 0, 1, .02], ["range", "tilt", "tilt", 0, 1, .05],
    ["range", "jitter", "shiver", 0, 1, .02], ["range", "breathe", "breathe", 0, 1, .02],
    ["range", "glitch", "glitch", 0, 1, .02], ["range", "trail", "afterimage", 0, .97, .01],
    ["h", "Colour"],
    ["select", "palette", "palette", ["rainbow", "sunset", "electric", "mint", "ember", "ocean", "mono"]],
    ["range", "flow", "colour flow", 0, 1, .02], ["range", "flowSpeed", "flow speed", 0, 3, .05],
    ["range", "blobs", "floating bg", 0, 1, .02], ["range", "guiltRate", "guilt", 0, 4, .1],
    ["color", "bg", "background"], ["color", "ink", "ink"], ["color", "guilt", "guilt"],
    ["check", "counter", "show counter"], ["check", "ring", "show cursor ring"]
  ];
  var LAYOUT_KEYS = /^(size|sizeMix|weight|line|spacing|font|caseMode|text|seed)$/;

  var S = Object.assign({}, DEFAULTS);
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function save() { lsSet("typefun-last", S); }

  // ---------- UI ----------
  var $ = function (id) { return document.getElementById(id); };
  var panel = $("panel"), ctl = $("controls"), effectEl = $("effect"), textEl = $("text"), favsEl = $("favs");
  Object.keys(EFFECTS).forEach(function (k) {
    var o = document.createElement("option"); o.value = k; o.textContent = EFFECTS[k].label; effectEl.appendChild(o);
  });
  effectEl.onchange = function () {
    var e = EFFECTS[effectEl.value]; S.effect = effectEl.value;
    ["radius", "strength", "spring", "damping"].forEach(function (k) { S[k] = e[k]; });
    resetPhysics(); buildUI(); save();
  };
  textEl.oninput = function () { S.text = textEl.value; setup(); save(); };

  function buildUI() {
    effectEl.value = S.effect; $("effectNote").textContent = EFFECTS[S.effect].note;
    if (document.activeElement !== textEl) textEl.value = S.text;
    ctl.innerHTML = ""; var sect = null;
    CONTROLS.forEach(function (c) {
      if (c[0] === "h") {
        sect = document.createElement("details"); sect.open = closed[c[1]] !== true;
        sect.innerHTML = "<summary>" + c[1] + "</summary>"; var nm = c[1];
        sect.ontoggle = function () { closed[nm] = !this.open; lsSet("typefun-closed", closed); };
        ctl.appendChild(sect); return;
      }
      if (c[0] === "range" && c[6] && c[6] !== S.effect) return;
      var row = document.createElement("label"); row.className = "row" + (c[0] === "range" ? "" : " wide");
      var lab = c[2]; if (c[1] === "radius" && S.effect === "ripple") lab = "ring width";
      row.innerHTML = "<span>" + lab + "</span>"; var input, val;
      if (c[0] === "range") {
        input = document.createElement("input"); input.type = "range"; input.min = c[3]; input.max = c[4]; input.step = c[5];
        input.value = S[c[1]]; val = document.createElement("span"); val.className = "v";
        var fmt = function () { val.textContent = (+input.value).toFixed(c[5] < .01 ? 3 : c[5] < 1 ? 2 : 0); }; fmt();
        input.oninput = function () { S[c[1]] = +input.value; fmt(); if (LAYOUT_KEYS.test(c[1])) setup(); save(); };
      } else if (c[0] === "select") {
        input = document.createElement("select");
        c[3].forEach(function (o) { var op = document.createElement("option"); op.value = op.textContent = o; input.appendChild(op); });
        input.value = S[c[1]]; input.onchange = function () { S[c[1]] = input.value; setup(); save(); };
      } else if (c[0] === "color") {
        input = document.createElement("input"); input.type = "color"; input.value = S[c[1]];
        input.oninput = function () { S[c[1]] = input.value; document.body.style.background = S.bg; save(); };
      } else {
        input = document.createElement("input"); input.type = "checkbox"; input.checked = !!S[c[1]];
        input.onchange = function () { S[c[1]] = input.checked ? 1 : 0; save(); };
      }
      row.appendChild(input); if (val) row.appendChild(val); (sect || ctl).appendChild(row);
    });
    document.body.style.background = S.bg;
  }
  var closed = lsGet("typefun-closed") || {};
  function apply(next) { S = Object.assign({}, DEFAULTS, next); buildUI(); setup(); save(); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.opacity = 0; }, 1600); }

  // ---------- favourites ----------
  var favs = lsGet("typefun-favs") || [];
  function buildFavs(sel) {
    favsEl.innerHTML = "";
    var o = document.createElement("option"); o.value = ""; o.textContent = favs.length ? "★ favourites (" + favs.length + ")" : "★ no favourites yet"; favsEl.appendChild(o);
    favs.forEach(function (f, i) { var op = document.createElement("option"); op.value = i; op.textContent = f.name; favsEl.appendChild(op); });
    favsEl.value = sel === undefined ? "" : sel; $("favDel").disabled = favsEl.value === "";
  }
  favsEl.onchange = function () {
    $("favDel").disabled = favsEl.value === "";
    if (favsEl.value !== "") { apply(favs[+favsEl.value].s); toast("loaded ★ " + favs[+favsEl.value].name); }
  };
  $("favSave").onclick = function () {
    var name = prompt("Name this favourite", EFFECTS[S.effect].label + " · " + S.font + " " + Math.round(S.size));
    if (!name) return;
    favs.push({ name: name, s: Object.assign({}, S) }); lsSet("typefun-favs", favs); buildFavs(String(favs.length - 1)); toast("saved ★ " + name);
  };
  $("favDel").onclick = function () {
    if (favsEl.value === "") return; var i = +favsEl.value;
    if (!confirm("Delete favourite \"" + favs[i].name + "\"?")) return;
    favs.splice(i, 1); lsSet("typefun-favs", favs); buildFavs(); toast("deleted");
  };

  // ---------- random ----------
  function r(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function chance(p) { return Math.random() < p; }
  function randomize() {
    var n = { text: S.text, counter: S.counter, ring: S.ring, seed: Math.floor(r(1, 9999)) };
    n.effect = pick(Object.keys(EFFECTS)); var e = EFFECTS[n.effect];
    n.radius = Math.round(e.radius * r(.6, 1.6)); n.strength = +(e.strength * r(.6, 1.8)).toFixed(2); n.spring = e.spring; n.damping = e.damping;
    n.font = pick(Object.keys(FONTS)); n.caseMode = pick(["upper", "upper", "lower", "as typed", "mixed"]);
    // size tiers give many more scale combinations than a flat range
    var tier = pick(["tiny", "small", "small", "mid", "mid", "big", "huge"]);
    n.size = Math.round({ tiny: r(7, 10), small: r(9, 18), mid: r(18, 40), big: r(40, 90), huge: r(90, 180) }[tier]);
    n.line = +pick([r(.7, 1), r(1, 1.6), r(1.6, 3)]).toFixed(2);
    n.size = Math.max(n.size, Math.round(Math.sqrt(innerWidth * innerHeight / (8000 * .6 * n.line))));  // keep it smooth
    var sp = pick(["tight", "none", "none", "loose", "wide", "huge"]);
    n.spacing = +({ tight: -r(.05, .3) * n.size, none: 0, loose: r(.05, .3) * n.size, wide: r(.3, 1) * n.size, huge: r(1, 2.5) * n.size }[sp]).toFixed(1);
    n.spacing = Math.max(-40, Math.min(240, n.spacing));
    n.sizeMix = chance(.4) ? +r(.2, 1.3).toFixed(2) : 0;
    n.weight = pick([100, 300, 400, 600, 800, 900]);
    n.slide = chance(.3) ? +r(.2, 2).toFixed(2) : 0; n.wave = chance(.3) ? +r(.2, 1).toFixed(2) : 0;
    n.spin = chance(.2) ? +r(.1, .8).toFixed(2) : 0; n.tilt = chance(.4) ? +r(.3, 1).toFixed(2) : 0;
    n.jitter = chance(.2) ? +r(.1, .6).toFixed(2) : 0; n.breathe = chance(.3) ? +r(.2, 1).toFixed(2) : 0;
    n.glitch = chance(.2) ? +r(.1, .7).toFixed(2) : 0; n.trail = chance(.3) ? +r(.4, .93).toFixed(2) : 0;
    n.palette = pick(["rainbow", "sunset", "electric", "mint", "ember", "ocean", "mono"]);
    n.flow = chance(.45) ? +r(.4, 1).toFixed(2) : 0; n.flowSpeed = +r(.1, 1.5).toFixed(2);
    n.blobs = chance(.4) ? +r(.3, 1).toFixed(2) : 0; n.guiltRate = chance(.5) ? +r(.3, 2).toFixed(1) : 0;
    var hue = r(0, 360), scheme = pick(["dark", "dark", "paper", "neon", "mono", "complement"]);
    if (scheme === "dark") { n.bg = hsl(hue, 18, 14); n.ink = hsl(hue, 10, 84); n.guilt = hsl((hue + 180) % 360, 90, 60); }
    if (scheme === "paper") { n.bg = hsl(hue, 30, 92); n.ink = hsl(hue, 30, 15); n.guilt = hsl((hue + 150) % 360, 85, 48); }
    if (scheme === "neon") { n.bg = hsl(hue, 60, 6); n.ink = hsl((hue + 120) % 360, 100, 62); n.guilt = hsl((hue + 240) % 360, 100, 62); }
    if (scheme === "mono") { n.bg = "#000000"; n.ink = "#ffffff"; n.guilt = hsl(hue, 100, 55); }
    if (scheme === "complement") { n.bg = hsl(hue, 70, 45); n.ink = hsl((hue + 180) % 360, 80, 85); n.guilt = hsl((hue + 60) % 360, 90, 55); }
    apply(n); resetPhysics(); toast("🎲 " + e.label + " · " + n.font + " " + n.size + "px");
  }
  $("random").onclick = randomize; $("miniRandom").onclick = randomize;
  var PALETTES = {
    sunset: ["#2d1b69", "#b0306a", "#ff6b3d", "#ffd23f"], electric: ["#00f0ff", "#7a5cff", "#ff2bd6"],
    mint: ["#0b3d3a", "#21c7a8", "#c8ffe9"], ember: ["#3a0a00", "#ff4d00", "#ffb000"],
    ocean: ["#022b4a", "#0a7cc2", "#5fe0e6", "#e8fbff"], mono: ["#444444", "#ffffff"]
  };
  var palCache = {};
  function palette(t) {                    // cyclic sample, t in 0..1
    t = ((t % 1) + 1) % 1;
    if (S.palette === "rainbow" || !PALETTES[S.palette]) return hslRgb(t * 360, 85, 62);
    var st = palCache[S.palette] || (palCache[S.palette] = PALETTES[S.palette].map(rgb)), n = st.length;
    var f = t * n, i = Math.floor(f) % n, j = (i + 1) % n, u = f - Math.floor(f); u = u * u * (3 - 2 * u);
    return [st[i][0] + (st[j][0] - st[i][0]) * u, st[i][1] + (st[j][1] - st[i][1]) * u, st[i][2] + (st[j][2] - st[i][2]) * u];
  }
  function hsl(h, s, l) { var c = hslRgb(h, s, l); return "#" + c.map(function (v) { return v.toString(16).padStart(2, "0"); }).join(""); }
  function hslRgb(h, s, l) {
    s /= 100; l /= 100; var a = s * Math.min(l, 1 - l);
    function f(n) { var k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); }
    return [f(0), f(8), f(4)];
  }

  // ---------- panel buttons, keys, link ----------
  function togglePanel(force) {
    var hide = force !== undefined ? force : !panel.classList.contains("hidden");
    panel.classList.toggle("hidden", hide); $("show").style.display = hide ? "flex" : "none";
  }
  $("hide").onclick = function () { togglePanel(true); }; $("showBtn").onclick = function () { togglePanel(false); };
  $("reset").onclick = function () { apply({ text: S.text }); resetPhysics(); toast("reset"); };
  $("link").onclick = function () {
    var url = location.origin + location.pathname + "#" + encodeURIComponent(JSON.stringify(S));
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast("link copied"); }, function () { prompt("Copy this link", url); });
    else prompt("Copy this link", url);
  };
  var paused = false;
  addEventListener("keydown", function (e) {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "h") togglePanel();
    if (k === "r") randomize();
    if (k === " ") { paused = !paused; e.preventDefault(); }
    if (k === "s") { var a = document.createElement("a"); a.download = "typefun.png"; a.href = cv.toDataURL("image/png"); a.click(); }
  });

  // ---------- engine ----------
  var cv = $("c"), x = cv.getContext("2d"), hud = $("hud");
  var dpr, W, H, cw, ch, cols, N = 0, G, gs, grow, gx, gy, ox, oy, vx, vy, rot, vr, heat, state, born, fx, fy, fvx, fvy, fr, fvr, pile, heights, fontStr;
  var mouse = { x: -1e4, y: -1e4, on: false }, taps = [], prev = performance.now(), sec = 0, nextHeat = 0;
  var busy = 0, still = 0, lastX = 0, lastY = 0, fallen = 0, rowGlitch = [];
  function rnd(i) { var v = Math.sin((i + S.seed * 7.31) * 12.9898) * 43758.5453; return v - Math.floor(v); }

  function setup() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    fontStr = S.weight + " " + S.size + "px " + FONTS[S.font]; x.font = fontStr;
    var t = (S.text || "").replace(/\s+/g, " ").trim() || " ";
    if (S.caseMode === "upper") t = t.toUpperCase(); else if (S.caseMode === "lower") t = t.toLowerCase();
    var P = t + " ", L = P.length;
    cw = Math.max(2, x.measureText("M").width + S.spacing); ch = Math.max(2, S.size * S.line);
    cols = Math.ceil(W / cw);
    // stream layout with real glyph widths; size chaos scales each letter
    var adv = {}, ax = [], ay = [], ag = [], as = [], ar = [], cx = 0, cy = S.size, row = 0, k = 0;
    while (cy < H + ch * 2 && k < 20000) {
      var c = P[k % L];
      if (S.caseMode === "mixed") c = rnd(k + 3) < .5 ? c.toLowerCase() : c.toUpperCase();
      var s = S.sizeMix ? Math.exp(S.sizeMix * 1.4 * (rnd(k) * 2 - 1)) : 1;
      if (adv[c] === undefined) adv[c] = x.measureText(c).width;
